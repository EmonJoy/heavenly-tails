<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="login.css">
    </head>

    <body>
        <center>
            <br><br>
            <h1>Login</h1><br>
            

            

            <form action="#" method="post">
                <table cellpadding="8" cellspacing="5">

                    <tr>


                        <td><b>Email:</b></td>
                        <td><input type="email" name="email" placeholder="Enter your email" size="30" required></td>


                    </tr>
                    <tr>

                        <td><b>Password:</b></td>

                        <td><input type="password" name="password" placeholder="Enter your password" size="30" required></td>
                    </tr>
                    <tr>

                        <td colspan="2" align="center"><br>
                            <input type="submit" value="Login">
                           
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                </table>
            </form>

            <br>
           
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </center>
    </body>

</html>
