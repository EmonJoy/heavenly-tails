<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="login.css">
    </head>

    <body>
        <center>
            <br><br>
            <h1>Login</h1><br>
            

            

            <form id="loginForm" action="#" method="post">
                <table cellpadding="8" cellspacing="5">

                    <tr>


                        <td><b>Email:</b></td>
                        <td><input type="email" name="email" id="email" placeholder="Enter your email" size="30" required></td>


                    </tr>
                    <tr>

                        <td><b>Password:</b></td>

                        <td><input type="password" name="password" id="password" placeholder="Enter your password" size="30" required></td>
                    </tr>
                    <tr>

                        <td colspan="2" align="center"><br>
                            <input type="submit" value="Login">
                           
                            <input type="reset" id="resetBtn" value="Reset">
                            <div id="resetSuccess" style="display: none;">
                                Reset Successful!
                            </div>
                        </td>
                    </tr>
                </table>
            </form>

            <br>
           
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </center>
        <script src="js/login.js"></script>
    </body>

</html>
