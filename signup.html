<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
    </head>

    <body>
        <center>
            <br><br>
            <h1>Sign Up</h1>
           
            <br>

            <form action="#" method="post">
                <table cellpadding="8" cellspacing="5">


                    <tr>
                        <td><b>Full Name:</b></td>
                        <td><input type="text" name="fullname" placeholder="Enter your full name" size="30" required></td>
                    </tr>


                    <tr>
                        <td><b>Email:</b></td>
                        <td><input type="email" name="email" placeholder="Enter your email" size="30" required></td>
                    </tr>
                    <tr>


                        <td><b>Phone:</b></td>
                        <td><input type="tel" name="phone" placeholder="Enter your phone number" size="30"></td>
                    </tr>
                    <tr>
                        <td><b>Password:</b></td>
                        <td><input type="password" name="password" placeholder="Create a password" size="30" required></td>
                    </tr>
                    <tr>
                        <td><b>Confirm Password:</b></td>
                        <td><input type="password" name="confirm_password" placeholder="Confirm your password" size="30" required></td>
                    </tr>


                    <tr>
                        <td><b>Gender:</b></td>
                        <td>
                            <input type="radio" name="gender" value="male"> Male
                           
                            <input type="radio" name="gender" value="female"> Female
                           
                            <input type="radio" name="gender" value="other"> Other
                        </td>
                    </tr>
                    <tr>



                        <td colspan="2" align="center">
                            <br>
                            <input type="submit" value="Sign Up">
                            
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                </table>

                
            </form>

            <br>
            <hr width="400">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </center>
    </body>

</html>
