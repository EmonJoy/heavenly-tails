<!DOCTYPE html>
<html>

<head>
    <title>Account Management</title>
    <link rel="stylesheet" href="account_manage.css">
</head>

<body>

    <h1>Havenly Tails</h1>

    <h2>Account Management</h2>

    <div class="container">

        <h3>View and Edit Profile</h3>

        <form>

            <label>Full Name:</label>
            <input type="text" placeholder="Enter your name">

            <label>Email:</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number:</label>
            <input type="text" placeholder="Enter phone number">

            <label>Address:</label>
            <input type="text" placeholder="Enter your address">

            <button type="button">Update Profile</button>

        </form>

    </div>


    <div class="container">

        <h3>Change / Reset Password</h3>

        <form>

            <label>Current Password:</label>
            <input type="password" placeholder="Enter current password">

            <label>New Password:</label>
            <input type="password" placeholder="Enter new password">

            <label>Confirm New Password:</label>
            <input type="password" placeholder="Confirm new password">

            <button type="button">Change Password</button>

        </form>

    </div>


    <div class="container">

        <h3>My Posts</h3>

        <div class="post">

            <h4>Injured Cat Near My House</h4>
            <p>Category: Animal Rescue</p>
            <p>Location: Dhaka</p>
            <p>Status: Pending</p>

            <button type="button">Delete Post</button>

        </div>

        <div class="post">

            <h4>Dog Needs Medical Assistance</h4>
            <p>Category: Medical Assistance</p>
            <p>Location: Mirpur, Dhaka</p>
            <p>Status: Under Review</p>

            <button type="button">Delete Post</button>

        </div>

    </div>

</body>
</html>
